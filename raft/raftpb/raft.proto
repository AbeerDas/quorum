syntax = "proto3";

package quorum.raft.v1;

option go_package = "github.com/AbeerDas/quorum/raft/raftpb";

// Raft carries consensus traffic between nodes. This is the internal surface:
// clients and the dashboard never speak it, they use the REST API instead
// (PRD.md Section 6).
service Raft {
  // RequestVote is sent by a candidate soliciting support for a new term.
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

  // AppendEntries replicates log entries, and doubles as the leader's heartbeat
  // when sent with no entries.
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

// LogEntry is one command in the replicated log. The command itself is opaque:
// agreeing on the order is Raft's job, interpreting it is the state machine's.
message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  bytes command = 3;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;

  // Hints letting a leader with a diverged log skip the whole conflicting run
  // in one round trip instead of backing up one entry at a time.
  uint64 conflict_index = 3;
  uint64 conflict_term = 4;

  // How far the follower has applied entries, letting the leader measure
  // replication lag through to apply rather than only to acknowledgement.
  uint64 applied_index = 5;
}
